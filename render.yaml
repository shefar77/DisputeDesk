# Render Blueprint — single free web service (API + built UI), embedded PGlite.
#
# Deliberately minimal for the hackathon demo:
#  - No managed Postgres. Demo mode regenerates its fixtures on every boot, so the
#    container's own disk (embedded PGlite) is enough and there is no 30-day free
#    database to expire before the demo window closes. Set DATABASE_URL in the
#    dashboard later if you ever want persistence.
#  - No cron. The reconciliation poll is a safety net for real PayPal webhooks
#    (FR-2); in demo mode there is nothing to reconcile, and a Render cron needs a
#    paid plan. The in-process poller still runs inside the web service.
#
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: disputedesk
    runtime: node
    plan: free
    # --include=dev so the build has vite/tsc even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # No PayPal credentials -> demo mode (fixtures, no outbound calls). Explicit
      # so a stray credential can never flip a public demo into sandbox writes.
      - key: DEMO_MODE
        value: "true"
      # Signs demo sessions; Render generates a strong value and keeps it stable.
      - key: SESSION_SECRET
        generateValue: true
      # --- AI: enter your Google AI Studio key in the dashboard -----------------
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3-flash-preview
      # Tried in order when the preferred model is unavailable (free-tier 503s).
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.8-flash
      # Hard daily spend stop, enforced in code. Falls back to the rule-based
      # generator when reached, so a public demo can never run up a bill.
      - key: LLM_DAILY_CAP_USD
        value: "5"
      # Optional: set a value to require a shared password for the public UI.
      - key: DEMO_PASSWORD
        sync: false
