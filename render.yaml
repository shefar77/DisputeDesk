# Render Blueprint — free web service (API + built UI) plus a free Postgres.
#
# On the managed database, and why it is not the embedded PGlite that works
# everywhere else. All three rows measured in a Linux container capped at 512 MiB,
# the same ceiling as a Render free instance:
#
#   PGlite, no data directory yet   OOM-killed. `initdb` loads a second WASM
#                                   module beside the main one and resident
#                                   memory jumps ~300 MiB in one step.
#   PGlite, data directory prebuilt survives, peaks at 419 MiB — under the
#                                   ceiling, but only ~90 MiB spare before the
#                                   model runs.
#   Managed Postgres                peaks at 90 MiB, serves all 14 fixtures.
#
# PGlite's WASM heap cannot be shrunk: its module declares 2048 pages (128 MiB),
# so a smaller `initialMemory` is a hard LinkError at startup. Hence Postgres in
# production. Locally, DATABASE_URL is unset and the app still uses PGlite, so
# `npm start` needs no database and the schema and queries are identical either
# way — the driver is the only difference.
#
# NOTE: Render's free Postgres expires 30 days after creation. If this demo must
# outlive that, either upgrade the database or create a fresh free one and update
# DATABASE_URL. Demo mode rebuilds its fixtures on every boot, so nothing of value
# is lost when it is replaced.
#
# No cron: the reconciliation poll is a safety net for real PayPal webhooks
# (FR-2); in demo mode there is nothing to reconcile, and a Render cron needs a
# paid plan. The in-process poller still runs inside the web service.
#
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
databases:
  - name: disputedesk-db
    databaseName: disputedesk
    user: disputedesk
    plan: free

services:
  - type: web
    name: disputedesk
    runtime: node
    plan: free
    # --include=dev so the build has vite/tsc even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Two things this line is doing, both measured on a 512 MiB budget:
    #
    # 1. It is deliberately NOT `npm start`. That spawns npm -> npm -w server ->
    #    node, and each npm is a full Node process: ~98 MiB spent on two
    #    wrappers whose only job is to exec the next one (408 MiB for the whole
    #    `npm start` tree vs 285 MiB for the server alone).
    # 2. --max-old-space-size caps the V8 heap. V8 sizes it from the HOST's RAM,
    #    not the container limit, so it lets the heap grow far too long before
    #    collecting: 421 MiB resident at boot without the flag, 298 MiB with it.
    #
    # The same flag is in the root `start` script, so a container that is still
    # running the old `npm start` command gets the cap too. PGlite's WASM heap
    # is separate and fixed at 128 MiB — its module declares 2048 pages, so it
    # cannot be lowered (a smaller value is a hard LinkError at startup).
    startCommand: node --max-old-space-size=256 server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Set -> node-postgres against the managed database above. Unset -> the
      # embedded PGlite, which does not fit in 512 MiB on a cold start.
      - key: DATABASE_URL
        fromDatabase:
          name: disputedesk-db
          property: connectionString
      # No PayPal credentials -> demo mode (fixtures, no outbound calls). Explicit
      # so a stray credential can never flip a public demo into sandbox writes.
      - key: DEMO_MODE
        value: "true"
      # Signs demo sessions; Render generates a strong value and keeps it stable.
      - key: SESSION_SECRET
        generateValue: true
      # --- AI: enter your Google AI Studio key in the dashboard -----------------
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3-flash-preview
      # Tried in order when the preferred model is unavailable (free-tier 503s).
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.8-flash
      # Hard daily spend stop, enforced in code. Falls back to the rule-based
      # generator when reached, so a public demo can never run up a bill.
      - key: LLM_DAILY_CAP_USD
        value: "5"
      # Optional: set a value to require a shared password for the public UI.
      - key: DEMO_PASSWORD
        sync: false
